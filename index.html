<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeHub Jan v0.3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🏡 HomeHub Jan</h1>
  <p>Deine Wohnungszentrale</p>
</header>

<main>

<section class="card" style="grid-column:1/-1;">
  <h2>Dashboard</h2>
  <div class="dashboard">
    <div class="card">
      <h3>💰 Budget</h3>
      <p><span id="budgetValue">0 €</span></p>
    </div>
    <div class="card">
      <h3>📋 Aufgaben</h3>
      <p id="taskCounter">Wird geladen…</p>
    </div>
    <div class="card">
      <h3>🚀 Status</h3>
      <p>HomeHub v0.3</p>
    </div>
  </div>
</section>

<section class="card">
<h2>Budget verwalten</h2>
<input id="budget" type="number" placeholder="Budget">
<button id="saveBudget">Budget speichern</button>
</section>

<section class="card">
<h2>Neue Aufgabe</h2>
<input id="taskInput" placeholder="Neue Aufgabe">
<button id="addTask">Aufgabe hinzufügen</button>
</section>

<section class="card" style="grid-column:1/-1;">
<h2>Aufgaben</h2>
<ul id="taskList"></ul>
</section>

</main>

<script type="module" src="./firebase.js"></script>
<script type="module" src="./app.js"></script>

<script>
const list=document.getElementById("taskList");
const counter=document.getElementById("taskCounter");
const update=()=>counter.textContent=`${list.children.length} offene Aufgaben`;
new MutationObserver(update).observe(list,{childList:true});
update();
</script>

</body>
</html>
