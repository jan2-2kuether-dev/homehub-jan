<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeHub 1.0</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="logo">
        <span class="logo-icon">🏠</span>
        <span class="logo-text">HomeHub</span>
    </div>

    <nav>
        <a href="#" class="active">🏠 Dashboard</a>
        <a href="#">📋 Aufgaben</a>
        <a href="#">💰 Budget</a>
        <a href="#">⚙ Einstellungen</a>
    </nav>
</aside>

<div class="content">

<header class="topbar">
    <button id="menuButton">☰</button>

    <div>
        <h1>Willkommen, Jan 👋</h1>
        <p>Deine persönliche Wohnungszentrale</p>
    </div>
</header>

<section class="dashboard">

<div class="stat-card">
    <h3>💰 Budget</h3>
    <span id="budgetValue">0 €</span>
</div>

<div class="stat-card">
    <h3>📋 Aufgaben</h3>
    <span id="taskCounter">0</span>
</div>

<div class="stat-card">
    <h3>✅ Erledigt</h3>
    <span id="doneCounter">0</span>
</div>

<div class="stat-card">
    <h3>📈 Fortschritt</h3>
    <span>0%</span>
</div>

</section>

<section class="grid">

<div class="card">

<h2>Budget verwalten</h2>

<input id="budget" type="number" placeholder="Budget eingeben">

<button id="saveBudget">
Budget speichern
</button>

</div>

<div class="card">

<h2>Neue Aufgabe</h2>

<input
id="taskInput"
placeholder="Neue Aufgabe eingeben">

<button id="addTask">
Aufgabe hinzufügen
</button>

</div>

<div class="card full">

<h2>Aufgaben</h2>

<ul id="taskList">
</ul>

</div>

</section>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>

<script>
const menu=document.getElementById("menuButton");
const sidebar=document.getElementById("sidebar");
menu.addEventListener("click",()=>sidebar.classList.toggle("collapsed"));
</script>

</body>
</html>
